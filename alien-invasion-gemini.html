<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #0b0c10; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Game State
    let score = 0;
    const player = { x: canvas.width/2, y: canvas.height/2, size: 15, color: '#66fcf1' };
    const bullets = [];
    const aliens = [];

    // Touch Controls (Simplified tap-to-shoot for mobile concept)
    canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        const angle = Math.atan2(touch.clientY - player.y, touch.clientX - player.x);
        bullets.push({ 
            x: player.x, y: player.y, 
            vx: Math.cos(angle) * 10, vy: Math.sin(angle) * 10 
        });
    });

    function spawnAlien() {
        const side = Math.random();
        let x, y;
        if (side < 0.5) { x = Math.random() < 0.5 ? 0 : canvas.width; y = Math.random() * canvas.height; } 
        else { x = Math.random() * canvas.width; y = Math.random() < 0.5 ? 0 : canvas.height; }
        aliens.push({ x, y, size: 12, speed: 2, color: '#c5c6c7' });
    }
    setInterval(spawnAlien, 1000);

    function gameLoop() {
        ctx.fillStyle = '#0b0c10';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Render Player (Hero Art Placeholder)
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
        ctx.fill();

        // Update & Render Bullets
        ctx.fillStyle = '#45a29e';
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx; b.y += b.vy;
            ctx.fillRect(b.x, b.y, 5, 5);
            if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
        }

        // Update & Render Aliens (Enemy Art Placeholder)
        ctx.fillStyle = '#c5c6c7';
        for (let i = aliens.length - 1; i >= 0; i--) {
            let a = aliens[i];
            const angle = Math.atan2(player.y - a.y, player.x - a.x);
            a.x += Math.cos(angle) * a.speed;
            a.y += Math.sin(angle) * a.speed;
            
            // Draw Alien (Triangle)
            ctx.beginPath();
            ctx.moveTo(a.x, a.y - a.size);
            ctx.lineTo(a.x - a.size, a.y + a.size);
            ctx.lineTo(a.x + a.size, a.y + a.size);
            ctx.fill();

            // Collision (Bullet vs Alien)
            for (let j = bullets.length - 1; j >= 0; j--) {
                const dist = Math.hypot(b.x - a.x, b.y - a.y);
                if (dist < a.size) {
                    aliens.splice(i, 1);
                    bullets.splice(j, 1);
                    score += 10;
                    break;
                }
            }
        }
        
        ctx.fillStyle = 'white';
        ctx.font = '20px Arial';
        ctx.fillText(`Biomass: ${score}`, 20, 40);
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>
</body>
</html>
